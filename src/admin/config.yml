backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: Create {{collection}} “{{slug}}”
    update: Update {{collection}} “{{slug}}”
    delete: Delete {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
    openAuthoring: "{{message}}"
media_folder: "/src/assets/img"
public_folder: "/assets/img"
collections:
  - name: "project"
    label: "Project"
    folder: "src/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (under ~25 words)", name: "desc", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Image Alt Text", name: "imageAlt", widget: "text" }
      - {
          label: "Order (lower number = higher on project list)",
          name: "order",
          widget: "number",
        }
      - { label: "Year of Project", name: "dated", widget: "number" }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["project"] }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "blog"
    label: "Blog"
    folder: "src/blogs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (under ~25 words)", name: "desc", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Image Alt Text", name: "imageAlt", widget: "text" }
      - { label: "Date", name: "dated", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["blog"] }
      - { label: "Body", name: "body", widget: "markdown" }
